<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-negro-tinta text-papel font-body">

    <header class="relative flex items-center justify-between px-6 tablet:px-8 py-5 border-b border-bronce/20">
      <span class="font-ui text-sm text-papel/70">Home</span>

      <!-- Nav Desktop/Tablet -->
      <nav class="hidden tablet:flex gap-6 font-ui text-sm">
        <a href="/src/pages/resultados.html" class="text-papel/70 transition-colors duration-300 ease-out hover:text-bronce focus-visible:text-bronce focus-visible:outline-none active:text-bronce/70">Resultados</a>
        <a href="/src/pages/detalle.html" class="text-papel/70 transition-colors duration-300 ease-out hover:text-bronce focus-visible:text-bronce focus-visible:outline-none active:text-bronce/70">Detalle</a>
      </nav>

      <!-- Toggle Mobile -->
      <input type="checkbox" id="menu-toggle" class="peer hidden" />
      <label
        for="menu-toggle"
        class="tablet:hidden cursor-pointer font-ui text-xl text-papel/70 transition-colors duration-300 ease-out hover:text-bronce peer-checked:hidden"
        aria-label="Abrir menú"
      >
        ☰
      </label>
      <label
        for="menu-toggle"
        class="tablet:hidden cursor-pointer font-ui text-xl text-papel/70 transition-colors duration-300 ease-out hover:text-bronce hidden peer-checked:block"
        aria-label="Cerrar menú"
      >
        ✕
      </label>

      <!-- Nav Mobile (dropdown) -->
      <nav class="hidden peer-checked:flex tablet:hidden flex-col absolute top-full left-0 w-full bg-negro-tinta border-b border-bronce/20 font-ui text-sm z-10">
        <a href="/src/pages/resultados.html" class="px-6 py-3 border-t border-bronce/10 text-papel/70 transition-colors duration-300 ease-out hover:text-bronce hover:bg-musgo/30">Resultados</a>
        <a href="/src/pages/detalle.html" class="px-6 py-3 border-t border-bronce/10 text-papel/70 transition-colors duration-300 ease-out hover:text-bronce hover:bg-musgo/30">Detalle</a>
      </nav>
    </header>

    <main class="px-6 tablet:px-8 py-10 max-w-4xl mx-auto">

      <h1 class="font-heading font-bold text-4xl text-papel mb-6">Explorer</h1>

      <!-- Al presionar Enter, envía el texto a Resultados como ?q=... -->
      <form action="/src/pages/resultados.html" method="get" role="search" class="mb-10">
        <label for="home-search" class="sr-only">Buscar país por nombre</label>
        <input
          id="home-search"
          type="search"
          name="q"
          autocomplete="off"
          enterkeyhint="search"
          placeholder="Buscar"
          class="w-full px-4 py-3 rounded-full bg-musgo text-papel font-ui text-sm placeholder:text-papel/50 border border-bronce/30 transition-colors duration-300 ease-out focus:outline-none focus:border-bronce"
        />
      </form>

      <section>
        <h2 class="font-heading font-semibold text-xl text-papel mb-4">Países Destacados</h2>

        <div class="grid grid-cols-1 tablet:grid-cols-2 desktop:grid-cols-3 gap-4">

          <a href="/src/pages/detalle.html" tabindex="0" class="group block overflow-hidden bg-musgo rounded-lg border border-bronce/20 cursor-pointer transition-all duration-300 ease-out hover:border-bronce hover:-translate-y-0.5 focus-visible:outline-none focus-visible:border-bronce active:translate-y-0">
            <img src="/assets/flags/el-salvador.svg" alt="Bandera de El Salvador" class="w-full h-32 object-cover transition-transform duration-300 ease-out group-hover:scale-105" />
            <div class="px-4 py-3">
              <h3 class="font-body text-lg text-papel">El Salvador</h3>
              <dl class="font-ui text-sm text-papel/60 flex flex-wrap gap-x-3 gap-y-1">
                <div class="flex gap-1">
                  <dt class="sr-only">Capital:</dt>
                  <dd>San Salvador</dd>
                </div>
                <div class="flex gap-1">
                  <dt class="sr-only">Región:</dt>
                  <dd>America</dd>
                </div>
                <div class="flex gap-1">
                  <dt class="sr-only">Población:</dt>
                  <dd>6.4M</dd>
                </div>
              </dl>
            </div>
          </a>

          <a href="/src/pages/detalle.html" tabindex="0" class="group block overflow-hidden bg-musgo rounded-lg border border-bronce/20 cursor-pointer transition-all duration-300 ease-out hover:border-bronce hover:-translate-y-0.5 focus-visible:outline-none focus-visible:border-bronce active:translate-y-0">
            <img src="/assets/flags/argentina.svg" alt="Bandera de Argentina" class="w-full h-32 object-cover transition-transform duration-300 ease-out group-hover:scale-105" />
            <div class="px-4 py-3">
              <h3 class="font-body text-lg text-papel">Argentina</h3>
              <dl class="font-ui text-sm text-papel/60 flex flex-wrap gap-x-3 gap-y-1">
                <div class="flex gap-1">
                  <dt class="sr-only">Capital:</dt>
                  <dd>Buenos Aires</dd>
                </div>
                <div class="flex gap-1">
                  <dt class="sr-only">Región:</dt>
                  <dd>America</dd>
                </div>
                <div class="flex gap-1">
                  <dt class="sr-only">Población:</dt>
                  <dd>47M</dd>
                </div>
              </dl>
            </div>
          </a>

          <a href="/src/pages/detalle.html" tabindex="0" class="group block overflow-hidden bg-musgo rounded-lg border border-bronce/20 cursor-pointer transition-all duration-300 ease-out hover:border-bronce hover:-translate-y-0.5 focus-visible:outline-none focus-visible:border-bronce active:translate-y-0">
            <img src="/assets/flags/colombia.svg" alt="Bandera de Colombia" class="w-full h-32 object-cover transition-transform duration-300 ease-out group-hover:scale-105" />
            <div class="px-4 py-3">
              <h3 class="font-body text-lg text-papel">Colombia</h3>
              <dl class="font-ui text-sm text-papel/60 flex flex-wrap gap-x-3 gap-y-1">
                <div class="flex gap-1">
                  <dt class="sr-only">Capital:</dt>
                  <dd>Bogotá</dd>
                </div>
                <div class="flex gap-1">
                  <dt class="sr-only">Región:</dt>
                  <dd>America</dd>
                </div>
                <div class="flex gap-1">
                  <dt class="sr-only">Población:</dt>
                  <dd>51M</dd>
                </div>
              </dl>
            </div>
          </a>

        </div>
      </section>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
