<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer App - Resultados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-negro-tinta text-papel font-body">

    <header class="flex items-center px-6 tablet:px-8 py-5 border-b border-bronce/20">
      <a href="/index.html" class="font-ui text-sm text-papel/70 transition-colors duration-300 ease-out hover:text-bronce focus-visible:text-bronce focus-visible:outline-none active:text-bronce/70">
        ← Atrás
      </a>
    </header>

    <main class="px-6 tablet:px-8 py-10 max-w-4xl mx-auto">

      <h1 class="font-heading font-bold text-4xl text-papel mb-6">Resultados</h1>

      <!-- Buscador + selector de región: apilados en mobile, en fila desde tablet -->
      <div role="search" class="flex flex-col tablet:flex-row tablet:items-center gap-4 mb-8">

        <div class="flex-1">
          <label for="search-input" class="sr-only">Buscar país por nombre</label>
          <input
            id="search-input"
            type="search"
            name="q"
            autocomplete="off"
            placeholder="Buscar país"
            class="w-full px-4 py-3 rounded-full bg-musgo text-papel font-ui text-sm placeholder:text-papel/50 border border-bronce/30 transition-colors duration-300 ease-out focus:outline-none focus:border-bronce"
          />
        </div>

        <div class="tablet:w-56">
          <label for="region-select" class="sr-only">Filtrar por región</label>
          <select
            id="region-select"
            name="region"
            disabled
            class="w-full px-4 py-3 rounded-full bg-musgo text-papel font-ui text-sm border border-bronce/30 transition-colors duration-300 ease-out focus:outline-none focus:border-bronce disabled:opacity-60 [&>option]:bg-negro-tinta [&>option]:text-papel"
          >
            <option value="all" selected>Todas las regiones</option>
          </select>
        </div>

      </div>

      <div id="country-list" class="grid grid-cols-1 tablet:grid-cols-2 desktop:grid-cols-3 gap-4"></div>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
