<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorer App - Resultados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-negro-tinta text-papel font-body">

    <header class="flex items-center px-6 tablet:px-8 py-5 border-b border-bronce/20">
      <a href="/index.html" class="font-ui text-sm text-papel/70 transition-colors duration-300 ease-out hover:text-bronce focus-visible:text-bronce focus-visible:outline-none active:text-bronce/70">
        ← Atrás
      </a>
    </header>

    <main class="px-6 tablet:px-8 py-10 max-w-4xl mx-auto">

      <h1 class="font-heading font-bold text-4xl text-papel mb-6">Resultados</h1>

      <!-- Buscador + Filtros: apilados en mobile, en fila desde tablet -->
      <div class="flex flex-col tablet:flex-row tablet:items-center gap-4 mb-8">

        <div class="flex-1">
          <input
            type="text"
            placeholder="Buscar"
            class="w-full px-4 py-3 rounded-full bg-musgo text-papel font-ui text-sm placeholder:text-papel/50 border border-bronce/30 transition-colors duration-300 ease-out focus:outline-none focus:border-bronce"
          />
        </div>

        <div class="flex gap-3 overflow-x-auto tablet:overflow-visible pb-1 tablet:pb-0">
          <button class="shrink-0 px-4 py-1.5 rounded-full bg-musgo text-papel font-ui text-sm border border-bronce/30 transition-all duration-300 ease-out hover:border-bronce focus-visible:outline-none focus-visible:border-bronce active:scale-95">
            Europa
          </button>
          <button class="shrink-0 px-4 py-1.5 rounded-full bg-musgo text-papel font-ui text-sm border border-bronce/30 transition-all duration-300 ease-out hover:border-bronce focus-visible:outline-none focus-visible:border-bronce active:scale-95">
            Asia
          </button>
          <button class="shrink-0 px-4 py-1.5 rounded-full bg-musgo text-papel font-ui text-sm border border-bronce/30 transition-all duration-300 ease-out hover:border-bronce focus-visible:outline-none focus-visible:border-bronce active:scale-95">
            America
          </button>
          <button class="shrink-0 px-4 py-1.5 rounded-full bg-musgo text-papel font-ui text-sm border border-bronce/30 transition-all duration-300 ease-out hover:border-bronce focus-visible:outline-none focus-visible:border-bronce active:scale-95">
            Africa
          </button>
        </div>

      </div>

      <div class="grid grid-cols-1 tablet:grid-cols-2 desktop:grid-cols-3 gap-4">

        <a href="/src/pages/detalle.html" tabindex="0" class="group block overflow-hidden bg-musgo rounded-lg border border-bronce/20 cursor-pointer transition-all duration-300 ease-out hover:border-bronce hover:-translate-y-0.5 focus-visible:outline-none focus-visible:border-bronce active:translate-y-0">
          <img src="/assets/flags/italia.svg" alt="Bandera de Italia" class="w-full h-32 object-cover transition-transform duration-300 ease-out group-hover:scale-105" />
          <div class="px-4 py-3">
            <h3 class="font-body text-lg text-papel">Italia</h3>
            <p class="font-ui text-sm text-papel/60">Roma · Europa · 60.3M</p>
          </div>
        </a>

        <a href="/src/pages/detalle.html" tabindex="0" class="group block overflow-hidden bg-musgo rounded-lg border border-bronce/20 cursor-pointer transition-all duration-300 ease-out hover:border-bronce hover:-translate-y-0.5 focus-visible:outline-none focus-visible:border-bronce active:translate-y-0">
          <img src="/assets/flags/albania.svg" alt="Bandera de Albania" class="w-full h-32 object-cover transition-transform duration-300 ease-out group-hover:scale-105" />
          <div class="px-4 py-3">
            <h3 class="font-body text-lg text-papel">Albania</h3>
            <p class="font-ui text-sm text-papel/60">Tirana · Europa · 2.4M</p>
          </div>
        </a>

      </div>

    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
